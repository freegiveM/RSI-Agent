[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-agent"
version = "0.1.0"
description = "Evidence-driven PR review agent with gated strategy evolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
agent = ["agentscope>=0.1.0"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["rsi_agent"]
