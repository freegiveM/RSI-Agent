[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-agent"
version = "0.1.0"
description = "Evidence-driven PR review agent with gated strategy evolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
agent = ["agentscope==2.0.9"]
server = ["fastapi>=0.115", "uvicorn>=0.30", "redis>=5.0"]
redis = ["redis>=5.0"]
dev = ["pytest>=8", "fastapi>=0.115", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["rsi_agent"]
